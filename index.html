<style>
  :root{--red:#e22a2a;--navy:#123a6b;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#f4f4f5;color:#18181b;display:flex;min-height:100vh;
       align-items:center;justify-content:center;padding:24px;}
  .card{background:#fff;border-radius:22px;padding:36px 24px;max-width:380px;width:100%;
        box-shadow:0 12px 44px rgba(0,0,0,.10);text-align:center;}
  .logo{width:120px;height:120px;object-fit:contain;margin:0 auto 16px;display:block;}
  .pin{width:58px;height:58px;margin:0 auto 14px;}
  h1{font-size:24px;margin:0 0 6px;letter-spacing:.5px;}
  h2{font-size:20px;margin:0 0 4px;}
  .sub{margin:0 0 26px;color:#71717a;font-size:14px;}
  a.btn,button.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
        border:none;cursor:pointer;text-decoration:none;font-weight:600;font-size:16px;
        padding:16px;border-radius:14px;margin-bottom:12px;transition:transform .05s;
        font-family:inherit;}
  a.btn:active,button.btn:active{transform:scale(.98);}
  .primary{background:var(--navy);color:#fff;}
  .secondary{background:#eef1f6;color:var(--navy);}
  .apple{background:#000;color:#fff;}
  .google{background:var(--red);color:#fff;}
  .yandex{background:#ffcc00;color:#18181b;}
  .back{background:none;color:#71717a;font-size:14px;margin-top:6px;padding:8px;}
  svg.ic{width:20px;height:20px;}
  .hidden{display:none;}
</style>
